---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flm-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      version: blue
  template:
    metadata:
      labels:
        version: blue
    spec:
      containers:
        - name: cont1
          image: sandeep181/tetrisgame:v1
          ports:
            - containerPort: 3000
